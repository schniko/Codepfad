<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codepfad.eu</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="reference-article.css">
  <link rel="stylesheet" href="footer.css">
</head>
<body>
  <div id="editor-toolbar-root"></div>

  <aside id="dev-toolbar" class="dev-toolbar" aria-label="Entwicklungsmodus" hidden>
    <strong>Entwicklungsmodus</strong>
    <label for="dev-path-select">Lernpfad</label>
    <select id="dev-path-select"></select>
    <button id="dev-reload" type="button">↻ Neu laden</button>
    <span id="dev-status" role="status" aria-live="polite"></span>
  </aside>

  <section id="learning-path" class="learning-path" aria-labelledby="path-title" hidden>
    <header class="path-head">
      <div class="path-heading"><div class="path-title-copy"><small id="path-subject">Lernpfad</small><h1 id="path-title"></h1></div><div id="path-level-switch" class="path-level-switch" role="group" aria-label="Niveau auswählen"><button type="button" data-path-level="basic" aria-pressed="false">Grundlegend</button><button class="active" type="button" data-path-level="advanced" aria-pressed="true">Erweitert</button></div></div>
      <div class="path-current"><span id="path-step-label"></span><strong id="path-step-title"></strong></div>
      <div class="path-tools"><span id="editor-lesson-tools-root"></span><button id="reset-learning-path" type="button">↺ Zurücksetzen</button><a id="path-reference" href="#nachschlagewerk" target="_blank" rel="noopener">Nachschlagewerk</a><button id="close-learning-path" type="button">Zu den Lernpfaden</button></div>
    </header>
    <nav id="path-steps" class="path-steps" aria-label="Schritte des Lernpfads"></nav>
    <div class="path-progress" aria-hidden="true"><span id="path-progress"></span></div>
    <div class="path-content">
      <article id="path-intro" class="path-intro"></article>
      <aside id="path-note" class="path-note"></aside>
      <nav class="path-navigation" aria-label="Zwischen den Lernschritten wechseln"><button id="path-back" type="button">← Zurück</button><button id="path-next" class="primary" type="button">Weiter →</button></nav>
    </div>
  </section>

  <div id="editor-workspace-root"></div>

  <div id="path-picker-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="path-picker-title">
    <div class="library-bar"><div class="wordmark"><img src="icon.svg" alt="">Codepfad.eu</div>
      <nav class="library-nav" aria-label="Hauptbereiche">
        <button id="nav-reference" type="button">Nachschlagewerk</button>
        <button id="nav-paths" type="button" aria-current="page">Lernpfade</button>
        <button id="cancel-path-picker" type="button">Editor</button>
      </nav>
      <div class="library-actions">
        <a href="https://github.com/schniko/Codepfad" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        <button id="install-update" hidden></button>
      </div>
    </div>
    <div id="path-picker-view" class="modal-card path-picker-card">
      <div class="library-hero">
        <div><h2 id="path-picker-title">Lernpfade</h2>
        <p>Entdecke HTML, CSS und JavaScript und probiere deinen Code direkt aus.</p></div>
        <img src="route.svg" alt="" aria-hidden="true">
      </div>
      <div id="path-picker-list-view">
        <div class="course-toolbar"><div id="topics" role="group" aria-label="Nach Thema filtern"></div><span id="course-count" aria-live="polite"></span></div>
        <div id="learning-path-list" class="learning-path-list"></div>
      </div>
      </div>
    <section id="reference-view" class="modal-card path-picker-card" aria-labelledby="reference-title" hidden></section>
    <footer class="site-footer">
      <a href="https://bolle-software.de/impressum/" target="_blank" rel="noopener noreferrer">Impressum</a>
    </footer>
  </div>

  <div id="editor-root"></div>
  <script src="content.js"></script>
  <script src="navigation.js"></script>
  <script src="reference-data.js"></script>
  <script src="reference.js"></script>
  <script src="script.js"></script>
  <script type="module" src="./reference-ui.js"></script>
</body>
</html>
