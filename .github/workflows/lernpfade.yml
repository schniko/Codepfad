name: Lernpfade veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Lernpfade/**'
      - 'Desktop/tools/package.mjs'
      - '.github/workflows/lernpfade.yml'

permissions:
  contents: write
concurrency:
  group: codepfad-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node Desktop/tools/package.mjs
      - name: Geprüften Stand als zusammenhängenden Git-Commit veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/codepfad-content"
          if git ls-remote --exit-code --heads origin content-v1; then
            git fetch --depth=1 origin refs/heads/content-v1
            git worktree add --detach "$feed" FETCH_HEAD
          else
            git worktree add --detach "$feed" HEAD
            git -C "$feed" checkout --orphan content-v1
            git -C "$feed" rm -rf --quiet .
          fi
          cp Desktop/dist/content/*.json "$feed/"
          git -C "$feed" add -- '*.json'
          if git -C "$feed" diff --cached --quiet; then exit 0; fi
          git -C "$feed" -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Lernpfade aktualisieren"
          git -C "$feed" push origin HEAD:refs/heads/content-v1
